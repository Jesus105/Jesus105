name: Update contribution calendar

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render_contributions.py
      - .github/workflows/contributions.yml

permissions:
  contents: read

concurrency:
  group: profile-contribution-calendar
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Render public contribution data
        run: python3 scripts/render_contributions.py --username Jesus105 --output-dir "$RUNNER_TEMP/calendar"
      - name: Publish images to the assets branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin profile-assets >/dev/null; then
            git fetch origin profile-assets:refs/remotes/origin/profile-assets
            git switch --create profile-assets --track origin/profile-assets
          else
            git switch --orphan profile-assets
          fi
          cp "$RUNNER_TEMP/calendar/contributions-light.svg" contributions-light.svg
          cp "$RUNNER_TEMP/calendar/contributions-dark.svg" contributions-dark.svg
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contributions-light.svg contributions-dark.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh contribution calendar'
          git push origin HEAD:profile-assets
